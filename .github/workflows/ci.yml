name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -d zend.assertions=1 -d assert.exception=1 tests/selfcheck.php
      - run: |
          php setup.php
          php -S 127.0.0.1:8000 -t public &
          sleep 2
          curl -fs http://127.0.0.1:8000/health.php
